<!DOCTYPE html>
<html>
<head>
    <title>&#128148; Valentine's Excuse Generator &#128148;</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap');

        body { 
            font-family: 'Luckiest Guy', cursive; 
            text-align: center; 
            margin-top: 50px; 
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
            overflow: hidden;
        }
        .excuse-box { 
            font-size: 26px; 
            color: #d60000; 
            font-weight: bold; 
            margin-top: 20px; 
            padding: 20px; 
            background: white; 
            display: inline-block; 
            border-radius: 10px;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
            animation: pop 0.5s ease-in-out;
        }
        button { 
            padding: 15px 35px; 
            font-size: 22px; 
            background: #ff1744; 
            color: white; 
            border: none; 
            border-radius: 30px; 
            cursor: pointer; 
            margin-top: 20px;
            transition: 0.3s;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
        }
        button:hover {
            background: #d60000;
            transform: scale(1.1);
        }
        .header {
            font-size: 42px;
            color: #fff;
            font-weight: bold;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }
        .subtext {
            font-size: 22px;
            color: #ffebf0;
        }
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .heart {
            position: absolute;
            font-size: 24px;
            animation: float 3s infinite;
            opacity: 0.8;
        }
        @keyframes float {
            0% { transform: translateY(0); opacity: 0.8; }
            50% { transform: translateY(-30px); opacity: 1; }
            100% { transform: translateY(-60px); opacity: 0; }
        }
    </style>
</head>
<body>
    <h1 class="header">&#128150; Valentine's Excuse Generator &#128150;</h1>
    <p class="subtext">Need a last-minute excuse to escape Valentine's Day plans? &#128514; Click below! &#128071;</p>
    
    <button onclick="generateExcuse()">&#128148; Give Me an Excuse! &#128148;</button>
    <div class="excuse-box" id="excuse">&#129315; Click the button to generate an excuse!</div>

    <script>
        function generateExcuse() {
            let excuses = [
                "&#128246; My WiFi is down, so I cannot text back forever. &#128557;",
                "&#129319; I just realized I am allergic to love doctor's orders! &#129398;",
                "&#128197; I have a work meeting at 9 PM on Valentines Day. &#129760;",
                "&#128054; My dog scheduled a dinner date with me. Priorities! &#128062;",
                "&#9992;&#65039; I accidentally booked a flight to another country ops! &#129322;",
                "&#128302; My horoscope says I should avoid romance today. &#127775;",
                "&#128148; I am still recovering from last years heartbreak send food. &#127829;",
                "&#129315; My imaginary girlfriend just broke up with me. I need time to heal. &#128557;",
                "&#129398; My heart is colder than the Arctic lets reschedule for summer. &#10052;&#65039;",
                "&#128657; I tripped over my own feelings and need medical attention. &#127973;"
            ];
            let randomExcuse = excuses[Math.floor(Math.random() * excuses.length)];
            document.getElementById("excuse").innerHTML = randomExcuse;

            generateFloatingHeart();
        }

        function generateFloatingHeart() {
            let heart = document.createElement("div");
            heart.innerHTML = "❤️";
            heart.classList.add("heart");
            heart.style.left = Math.random() * window.innerWidth + "px";
            heart.style.top = "100%";
            heart.style.animationDuration = Math.random() * 3 + 2 + "s";
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 3000);
        }
    </script>
</body>
</html>
